# Docker workflow for local development. Contributors do not need PHP or
# composer installed on the host — everything runs inside containers.
#
#   docker compose run --rm composer install
#   docker compose run --rm phpunit
#   docker compose run --rm phpunit-8.3     # PHP 8.3 compatibility check
#   docker compose run --rm phpunit-8.5     # latest stable PHP compatibility check
#   docker compose run --rm php -v          # ad-hoc PHP invocation
#
# All image tags are pinned to exact patch versions for reproducibility — bump
# them deliberately when you want to move to a newer toolchain.
services:
  composer:
    image: composer:2.10.2
    volumes:
      - .:/app
    working_dir: /app

  phpunit:
    image: php:8.5.10-cli
    volumes:
      - .:/app
    working_dir: /app
    command: vendor/bin/phpunit

  phpunit-8.3:
    image: php:8.5.10-cli
    volumes:
      - .:/app
    working_dir: /app
    command: vendor/bin/phpunit

  phpunit-8.5:
    image: php:8.5.10-cli
    volumes:
      - .:/app
    working_dir: /app
    command: vendor/bin/phpunit

  php:
    image: php:8.5.10-cli
    volumes:
      - .:/app
    working_dir: /app
